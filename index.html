<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>捷展供应链业务总看板</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#1e293b;--sub:#64748b;--border:#e2e8f0;--accent:#dc2626;--blue:#2563eb}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.header{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:20px 24px;text-align:center;position:relative}
.header h1{font-size:20px;font-weight:700;letter-spacing:1px}.header h1 span{color:#f97316}
.header .sub{font-size:12px;opacity:.6;margin-top:4px}
.container{max-width:1200px;margin:0 auto;padding:16px}
.month-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.month-tab{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:12px;font-weight:500;transition:all .2s}
.month-tab:hover{border-color:var(--blue);color:var(--blue)}
.month-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--border);text-align:center}
.kpi-card .label{font-size:12px;color:var(--sub);margin-bottom:4px}
.kpi-card .value{font-size:22px;font-weight:800;color:var(--blue)}
.kpi-card .sub{font-size:11px;color:var(--sub);margin-top:4px}
.kpi{background:var(--card);border-radius:12px;padding:16px;text-align:center;border:1px solid var(--border)}
.kpi .label{font-size:11px;color:var(--sub);margin-bottom:4px;font-weight:600}
.kpi .value{font-size:32px;font-weight:800}
.kpi .detail{font-size:11px;color:var(--sub);margin-top:4px}
.progress{height:6px;background:var(--border);border-radius:3px;margin-top:8px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .5s}
.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.team-card{border-radius:12px;padding:16px;border:2px solid}
.team-card h3{font-size:16px;font-weight:800;margin-bottom:10px}
.team-card .metric{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0}
.team-card .metric .k{font-size:12px;color:#555}.team-card .metric .v{font-size:14px;font-weight:700}
.team-card .rate{font-size:22px;font-weight:800;margin-top:6px}
.rank-section{margin-bottom:16px}
.rank-section h2{font-size:15px;font-weight:700;margin-bottom:10px}
.rank-table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.rank-table th{text-align:left;padding:8px 10px;font-size:11px;color:var(--sub);background:#f8fafc;border-bottom:1px solid var(--border)}
.rank-table td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}
.rank-table tr:last-child td{border-bottom:none}
.rank-table .num{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.medal{font-size:16px}
.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:9px;color:#fff;margin-left:4px}
.rate-bar{position:relative;height:22px;background:#f0f0f0;border-radius:4px;min-width:100px}
.rate-fill{height:100%;border-radius:4px;max-width:100%}
.rate-text{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;color:#333}
.footer{text-align:center;color:var(--sub);font-size:11px;padding:16px}
.countdown{font-size:28px;font-weight:800;color:var(--accent)}
#week-rank{display:none}
.refresh-btn{position:absolute;right:20px;top:50%;transform:translateY(-50%);background:#f97316;color:#fff;border:none;padding:8px 16px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .2s}
.refresh-btn:hover{background:#ea580c;transform:translateY(-50%) scale(1.02)}
.refresh-btn:disabled{opacity:.7;cursor:not-allowed}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:1024px){.vip-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
  .container{padding:10px}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .kpi .value{font-size:22px}
  .team-grid{grid-template-columns:1fr}
  .rank-table th,.rank-table td{padding:6px 6px;font-size:11px}
  .rate-bar{min-width:70px}
  .countdown{font-size:22px}
  .refresh-btn{padding:6px 10px;font-size:10px;right:10px}
}

.top-tabs{display:flex;gap:8px;margin-bottom:16px;border-bottom:2px solid #e2e8f0;padding-bottom:0}
.top-tab{padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s;color:#94a3b8}
.top-tab:hover{color:#1e293b}
.top-tab.active{color:#3b82f6;border-bottom-color:#3b82f6}
.vip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.vip-card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:transform .2s,box-shadow .2s}
.vip-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.vip-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.vip-name{font-size:16px;font-weight:700}
.vip-status{font-size:11px;color:#fff;padding:3px 8px;border-radius:4px;font-weight:600}
.vip-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.vip-metric-label{display:block;font-size:11px;color:#94a3b8}
.vip-metric-val{display:block;font-size:14px;font-weight:600;margin-top:2px}
.vip-card-footer{display:flex;justify-content:space-between;font-size:12px;color:#64748b;padding-top:8px;border-top:1px solid #f1f5f9}
.vip-card-follow{font-size:11px;color:#94a3b8;margin-top:6px}
.vip-todo-section{margin-top:24px;background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.vip-todo-section h3{margin:0 0 12px;font-size:16px}
.todo-controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.todo-input{padding:8px 12px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;flex:1;min-width:150px}
.todo-select{padding:8px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px}
.todo-add-btn{padding:8px 16px;background:#3b82f6;color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.todo-add-btn:hover{background:#2563eb}
.todo-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px;table-layout:auto}
.todo-table th{background:#f8fafc;padding:8px 6px;text-align:left;font-weight:600;border-bottom:2px solid #e2e8f0;white-space:nowrap;font-size:11px}
.todo-table td{padding:8px 6px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.todo-table tr:hover{background:#fafbfc}
.time-bar{height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;min-width:60px}
.time-fill{height:100%;border-radius:3px}
.status-chip{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap}
.progress-input{width:100%;padding:4px 6px;border:1px solid #e2e8f0;border-radius:4px;font-size:11px}
.todo-del{border:none;background:none;cursor:pointer;color:#cbd5e1;font-size:18px}.todo-del:hover{color:#ef4444}
.todo-done-btn{border:none;background:#10b981;color:#fff;cursor:pointer;border-radius:4px;width:24px;height:24px;font-size:14px;font-weight:700;margin-right:4px}.todo-done-btn:hover{background:#059669}
.inline-edit{border:none;background:transparent;padding:2px 4px;font-size:12px;width:100%;min-width:50px;outline:none;color:#1e293b;box-sizing:border-box}.inline-edit:focus{background:#f1f5f9;border-radius:4px;box-shadow:0 0 0 1px #3b82f6}
input[type="date"].inline-edit{width:110px;min-width:110px;font-size:11px;padding:2px 2px}
input[type="text"].inline-edit{min-width:60px}
select.inline-edit{cursor:pointer;padding:2px 0;font-size:11px}
.todo-undo{border:none;background:#94a3b8;color:#fff;cursor:pointer;border-radius:4px;width:24px;height:24px;font-size:12px;margin-right:4px}.todo-undo:hover{background:#64748b}
.vip-monthly{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:8px}
.vip-month-item{text-align:center;padding:8px 4px;background:#f8fafc;border-radius:6px}
.vip-month-label{display:block;font-size:11px;color:#64748b;margin-bottom:4px}
.vip-month-val{font-size:13px;font-weight:600;color:#1e293b}
.vip-detail-info{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;padding:12px 16px;background:#f8fafc;border-radius:8px;margin:12px 0}
.info-row{display:flex;align-items:center;gap:8px}
.info-label{font-size:12px;color:#64748b;min-width:60px}
.info-val{font-size:13px;color:#1e293b}
.vip-website-input{border:1px solid #e2e8f0;border-radius:4px;padding:4px 8px;font-size:12px;width:200px;outline:none}.vip-website-input:focus{border-color:#3b82f6}
.todo-stats{margin-bottom:14px}
.ts-overview{display:flex;align-items:center;gap:16px;padding:12px 16px;background:#f8fafc;border-radius:8px;flex-wrap:wrap}
.ts-nums{display:flex;gap:16px}
.ts-item{text-align:center}
.ts-num{display:block;font-size:20px;font-weight:800}
.ts-label{font-size:10px;color:#94a3b8}
.ts-bar{flex:1;height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;display:flex;min-width:80px}
.ts-bar>div{height:100%}
.ts-persons{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ts-person{display:flex;align-items:center;gap:5px;padding:5px 10px;background:#fff;border:1px solid #e2e8f0;border-radius:6px;font-size:11px}
.ts-pname{font-weight:600;margin-right:4px}
.ts-pbadge{min-width:16px;height:16px;line-height:16px;text-align:center;border-radius:8px;font-size:10px;font-weight:600;color:#fff}

.todo-list{display:flex;flex-direction:column;gap:6px}
.todo-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f8fafc;border-radius:6px;border-left:3px solid #94a3b8}
.todo-item.priority-high{border-left-color:#ef4444}
.todo-item.priority-mid{border-left-color:#f59e0b}
.todo-item.priority-low{border-left-color:#10b981}
.todo-item.done{opacity:.5;text-decoration:line-through}
.todo-item input[type=checkbox]{width:16px;height:16px;cursor:pointer}
.todo-item .todo-text{flex:1;font-size:13px}
.todo-item .todo-customer{font-size:11px;color:#3b82f6;background:#eff6ff;padding:2px 6px;border-radius:3px}
.todo-item .todo-priority{font-size:11px;padding:2px 6px;border-radius:3px;font-weight:600}
.todo-item .todo-priority.p-high{color:#ef4444;background:#fef2f2}
.todo-item .todo-priority.p-mid{color:#f59e0b;background:#fffbeb}
.todo-item .todo-priority.p-low{color:#10b981;background:#ecfdf5}
.todo-item .todo-date{font-size:11px;color:#94a3b8}
.todo-item .todo-delete{cursor:pointer;color:#94a3b8;font-size:16px;padding:0 4px}
.todo-item .todo-delete:hover{color:#ef4444}
.vip-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center}
.vip-modal-content{background:#fff;border-radius:12px;padding:24px;max-width:500px;width:90%;max-height:85vh;overflow-y:auto;position:relative}
.vip-modal-close{position:absolute;top:12px;right:16px;background:none;border:none;font-size:24px;cursor:pointer;color:#94a3b8}
.vip-modal-close:hover{color:#1e293b}
.vip-detail-header{margin-bottom:16px}
.vip-detail-header h2{margin:0;font-size:20px}
.vip-detail-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0;padding:12px;background:#f8fafc;border-radius:8px}
.vip-detail-metrics div{text-align:center}
.vip-detail-metrics .dm-label{font-size:11px;color:#94a3b8}
.vip-detail-metrics .dm-val{font-size:18px;font-weight:700;margin-top:2px}
.vip-detail-section{margin-top:16px}
.vip-detail-section h4{font-size:14px;margin:0 0 8px;color:#475569}
.vip-follow-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
.vip-follow-item .follow-date{color:#64748b;min-width:80px}
.vip-follow-item .follow-content{color:#1e293b;flex:1}
@media(max-width:768px){.vip-grid{grid-template-columns:1fr}.vip-metrics{grid-template-columns:repeat(3,1fr)}.todo-controls{flex-direction:column}.vip-modal-content{max-width:95%;padding:16px}}
/* === Marketing Tab === */
.mkt-section{margin-bottom:24px}
.mkt-section h2{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.mkt-calendar{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.mkt-cal-card{min-width:200px;max-width:240px;background:var(--card);border-radius:10px;padding:14px;border:1px solid var(--border);flex-shrink:0}
.mkt-cal-card .cal-date{font-size:12px;color:var(--blue);font-weight:600;margin-bottom:6px}
.mkt-cal-card .cal-subject{font-size:14px;font-weight:700;margin-bottom:4px;line-height:1.4;outline:none;border-bottom:1px dashed transparent;min-height:20px}
.mkt-cal-card .cal-subject:focus{border-bottom-color:#2563eb;background:#f8fafc}
.mkt-cal-card .cal-direction{font-size:12px;color:var(--sub);margin-bottom:8px;outline:none;border-bottom:1px dashed transparent;min-height:16px}
.mkt-cal-card .cal-direction:focus{border-bottom-color:#2563eb;background:#f8fafc}
.mkt-cal-card .cal-tags{display:flex;flex-wrap:wrap;gap:4px}
.mkt-tag{font-size:10px;padding:2px 6px;border-radius:3px;font-weight:600}
.mkt-tag.done{background:#dcfce7;color:#16a34a}
.mkt-tag.pending{background:#f1f5f9;color:#94a3b8}
.mkt-kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.mkt-kpi{background:var(--card);border-radius:10px;padding:16px 12px;text-align:center;border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90px}
.mkt-kpi .mk-label{font-size:11px;color:var(--sub);font-weight:600;white-space:nowrap}
.mkt-kpi .mk-value{font-size:22px;font-weight:800;margin:6px 0 2px}
.mkt-kpi .mk-sub{font-size:11px;color:var(--sub)}
.mkt-chart-row{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.mkt-chart-box{background:var(--card);border-radius:10px;padding:16px;border:1px solid var(--border);min-height:260px}
.mkt-funnel-table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.mkt-funnel-table th{text-align:left;padding:8px 10px;font-size:11px;color:var(--sub);background:#f8fafc;border-bottom:1px solid var(--border)}
.mkt-funnel-table td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px}
.mkt-funnel-table tr:last-child td{border-bottom:none}
.mkt-funnel-table .warn{color:#ef4444;font-weight:700}
.mkt-funnel-visual{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:16px}
.funnel-bar{height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;transition:width .5s}
@media(max-width:768px){
  .mkt-chart-row{grid-template-columns:1fr}
  .mkt-calendar{flex-direction:column}
  .mkt-cal-card{min-width:auto;max-width:none}
  .mkt-kpi-row{grid-template-columns:repeat(2,1fr)}
  .mkt-kpi .mk-value{font-size:18px}
  .mkt-kpi{min-height:70px;padding:12px 8px}
  .gantt-chart{overflow-x:auto}
  .gantt-cells{grid-template-columns:repeat(31,1fr)}
  .mkt-chart-row{grid-template-columns:1fr}
}
.mkt-month-btn{padding:4px 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);font-size:12px;cursor:pointer;font-weight:600;color:var(--sub);transition:all .2s}
.mkt-month-btn.active{background:#2563eb;color:#fff;border-color:#2563eb}
.mkt-month-btn:hover:not(.active){background:#f1f5f9}
.mkt-add-btn{padding:4px 12px;border:1px dashed #2563eb;border-radius:6px;background:transparent;font-size:12px;cursor:pointer;color:#2563eb;font-weight:600}
.mkt-add-btn:hover{background:#eff6ff}
.mkt-edit-btn,.mkt-del-btn{border:none;background:none;cursor:pointer;font-size:14px;padding:2px 4px;border-radius:4px;opacity:.6}
.mkt-edit-btn:hover{opacity:1;color:#2563eb}.mkt-del-btn:hover{opacity:1;color:#ef4444}
.gantt-chart{margin-bottom:16px;border:1px solid var(--border);border-radius:10px;overflow-x:auto;background:var(--card)}
.gantt-row{display:flex;align-items:stretch;border-bottom:1px solid #f1f5f9}
.gantt-row:last-child{border-bottom:none}
.gantt-header-row{background:#f8fafc;position:sticky;top:0}
.gantt-label{width:120px;min-width:120px;padding:6px 8px;font-size:11px;font-weight:600;border-right:1px solid var(--border);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center}
.gantt-cells{display:grid;grid-template-columns:repeat(31,minmax(18px,1fr));flex:1}
.gantt-cell{padding:4px 0;text-align:center;font-size:9px;border-right:1px solid #f8fafc;min-height:24px;display:flex;align-items:center;justify-content:center}
.gantt-cell.gantt-header{font-weight:700;font-size:10px;color:var(--sub)}
.gantt-cell.weekend{color:#94a3b8;background:#fafafa}
.gantt-cell.gantt-active{background:#3b82f6;border-radius:2px;margin:3px 0}
.gantt-cell.gantt-active-kll{background:#ea580c;border-radius:2px;margin:3px 0}
.mkt-theme-card{background:linear-gradient(135deg,#f0f9ff,#eff6ff);border:1px solid #bfdbfe;border-radius:10px;padding:12px 16px;margin-bottom:12px;cursor:pointer;transition:all .2s}
.mkt-theme-card:hover{border-color:#2563eb;box-shadow:0 2px 8px rgba(37,99,235,.1)}
.theme-label{font-size:11px;color:#64748b;margin-bottom:4px;font-weight:600}
.theme-text{font-size:14px;font-weight:700;color:#1e293b;outline:none;border-bottom:1px dashed transparent;min-height:20px;padding:2px 4px}
.theme-text:focus{border-bottom-color:#2563eb;background:#f0f7ff}
.theme-text:empty:before{content:'点击设置本月主题';color:#94a3b8;font-weight:400}
.event-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.event-modal{background:#fff;border-radius:12px;padding:24px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.event-modal h3{margin-bottom:16px;font-size:18px}
.event-modal label{display:block;font-size:12px;color:#64748b;margin:12px 0 4px;font-weight:600}
.event-modal input,.event-modal textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px}
.event-modal textarea{min-height:80px;resize:vertical}
.event-modal .btn-row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.event-modal .btn-primary{background:#2563eb;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px}
.event-modal .btn-secondary{background:#e2e8f0;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px}
.attachment-list{margin-top:8px}
.attachment-item{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#f8fafc;border-radius:6px;margin-bottom:4px;font-size:12px}
.attachment-item a{color:#2563eb;text-decoration:none;word-break:break-all}
.mkt-cal-card.expanded{padding:16px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card-actions{display:flex;gap:4px}
.inline-date-input{border:none;background:transparent;color:var(--blue);font-size:12px;font-weight:600;padding:2px 4px;border-radius:4px;cursor:pointer}
.inline-date-input:focus{background:#f0f7ff;outline:1px solid var(--blue)}
.card-materials{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.mat-label{font-size:11px;color:#64748b;margin-bottom:6px;font-weight:600}
.mat-list{display:flex;flex-wrap:wrap;gap:6px}
.mat-check{display:flex;align-items:center;gap:3px;cursor:pointer;font-size:12px}
.mat-check input{width:14px;height:14px;accent-color:#2563eb}
.mat-name{color:#475569}
.mat-name.checked{color:#2563eb;font-weight:600}
.card-attachments{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
.attach-item{display:flex;flex-direction:column;align-items:center;gap:4px;width:72px}
.attach-thumb{width:64px;height:64px;border-radius:6px;object-fit:cover;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid var(--border)}
.video-thumb{background:#1e293b;color:#fff;font-size:24px}
.file-thumb{background:#f8fafc}
.attach-name{font-size:10px;color:#64748b;text-align:center;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;cursor:pointer}
.attach-name:hover{color:#2563eb}
.attach-thumb{cursor:pointer}
.attach-del{border:none;background:none;color:#ef4444;font-size:11px;cursor:pointer;padding:0}
.card-upload{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.upload-row{display:flex;gap:4px;align-items:center;flex-wrap:nowrap;max-width:100%;overflow:hidden}
.attach-url-input{flex:1;min-width:0;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px}
.upload-btn{border:none;background:#f1f5f9;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap;flex-shrink:0}
.kll-cards-grid{display:flex;flex-wrap:wrap;gap:12px}
.kll-card{width:calc(20% - 10px);min-width:200px;max-width:240px;background:var(--card);border-radius:10px;padding:14px;border:1px solid #fed7aa;border-left:3px solid #ea580c;flex-shrink:0}
.kll-card .cal-subject{font-size:14px;font-weight:700;margin-bottom:4px;line-height:1.4;outline:none;border-bottom:1px dashed transparent;min-height:20px}
.kll-card .cal-subject:focus{border-bottom-color:#ea580c;background:#fff7ed}
.kll-card .cal-direction{font-size:12px;color:var(--sub);margin-bottom:8px;outline:none;border-bottom:1px dashed transparent;min-height:16px}
.kll-card .cal-direction:focus{border-bottom-color:#ea580c;background:#fff7ed}
.kll-card.kll-published{opacity:0.7;border-left-color:#22c55e}
.kll-publish{margin:8px 0 4px;font-size:12px}
.kll-publish .mat-check{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.kll-publish .mat-name.checked{color:#22c55e;text-decoration:line-through}
</style>

function fmtW(val){return val>=10000?'¥'+(val/10000).toFixed(1)+'万':val>0?'¥'+Math.round(val).toLocaleString():'¥0'}
function calcDaysSinceFollow(v){
  if(!v.last_follow_date||v.last_follow_date==='-') return 999;
  const d=new Date(v.last_follow_date),today=new Date();
  today.setHours(0,0,0,0);d.setHours(0,0,0,0);
  return Math.max(0,Math.round((today-d)/86400000));
}

// Todo system with localStorage
const TODO_KEY = 'jiezhan_vip_todos';
function getStatus(t){
  if(t.done) return 'done';
  const today=new Date().toISOString().slice(0,10);
  const s=t.startDate||'',e=t.deadline||'';
  if(e&&e<today) return 'overdue'; // 逾期未完成
  if(!s&&!e) return 'pending';
  if(s>today) return 'notstarted';
  if(s<=today&&(!e||e>=today)) return 'inprogress';
  return 'pending';
}
function getStatusLabel(s){return{done:'已完成',inprogress:'进行中',pending:'待开始',overdue:'未完成',notstarted:'未开始'}[s]||'-'}
function getStatusColor(s){return{done:'#10b981',inprogress:'#3b82f6',pending:'#94a3b8',overdue:'#ef4444',notstarted:'#cbd5e1'}[s]||'#94a3b8'}
function calcTimePct(t){
  const s=t.startDate||'',e=t.deadline||'';
  if(!s||!e) return -1;
  const sd=new Date(s).getTime(),ed=new Date(e).getTime(),now=Date.now();
  if(ed<=sd) return t.done?100:0;
  return Math.max(0,Math.min(100,Math.round((now-sd)/(ed-sd)*100)));
}

function ensureECharts(cb){
  if(typeof echarts!=='undefined'){echartsReady=true;cb();return}
  if(echartsReady){cb();return}
  pendingCharts.push(cb);
  if(document.querySelector('script[src*="echarts"]'))return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js';
  s.onerror=()=>{const s2=document.createElement('script');s2.src='https://unpkg.com/echarts@5/dist/echarts.min.js';s2.onload=()=>{echartsReady=true;pendingCharts.forEach(fn=>fn());pendingCharts=[]};document.head.appendChild(s2)};
  s.onload=()=>{echartsReady=true;pendingCharts.forEach(fn=>fn());pendingCharts=[]};
  document.head.appendChild(s);
}

function getEventAttachments(itemId){
  const evts=getCustomEvents();
  const evt=evts.find(e=>e.id===itemId);
  return (evt&&evt.attachments)||[];
}

function getMaterialState(itemId){
  // For plan_ items, store material state in localStorage
  if(itemId.startsWith('plan_')){
    try{return JSON.parse(localStorage.getItem('mat_'+MKT_PLAN_MONTH+'_'+itemId)||'null')}catch{return null}
  }
  return null; // custom events use their own materials
}

function getAllAttachments(itemId){
  // Check session memory first (includes blob URLs)
  if(window._sessionAttachments){
    const key=itemId.startsWith('plan_')?(MKT_PLAN_MONTH+'_'+itemId):itemId;
    if(window._sessionAttachments[key])return window._sessionAttachments[key];
  }
  // Custom events: from custom events storage
  if(!itemId.startsWith('plan_')){
    const evts=getCustomEvents();
    const evt=evts.find(e=>e.id===itemId);
    return (evt&&evt.attachments)||[];
  }
  // Plan items: stored separately in localStorage
  try{return JSON.parse(localStorage.getItem('attach_'+MKT_PLAN_MONTH+'_'+itemId)||'[]')}catch{return[]}
}

function savePlanAttachments(itemId,attachments){
  localStorage.setItem('attach_'+MKT_PLAN_MONTH+'_'+itemId,JSON.stringify(attachments));
}

function handleFileUpload(itemId,input){
  const files=input.files;
  if(!files.length)return;
  Array.from(files).forEach(file=>{
    const isImg=file.type.startsWith('image/');
    const isVid=file.type.startsWith('video/');
    // For video/large files: use object URL (not data URL) to avoid localStorage size limit
    // For images < 2MB: use data URL for thumbnail persistence
    if(isVid || file.size > 2*1024*1024){
      const objUrl=URL.createObjectURL(file);
      const entry={name:file.name,url:objUrl,type:isVid?'video':'file',size:file.size,blob:true};
      addAttachEntry(itemId,entry);
      renderMarketing();
    }else{
      const reader=new FileReader();
      reader.onload=function(e){
        const entry={name:file.name,url:e.target.result,type:isImg?'image':'file',size:file.size};
        addAttachEntry(itemId,entry);
        renderMarketing();
      };
      reader.readAsDataURL(file);
    }
  });
  input.value='';
}

function addAttachEntry(itemId,entry){
  if(itemId.startsWith('plan_')){
    const arr=getAllAttachments(itemId);
    arr.push(entry);
    // For blob URLs, we can't persist to localStorage; store non-blob entries only
    const persistable=arr.filter(a=>!a.blob);
    localStorage.setItem('attach_'+MKT_PLAN_MONTH+'_'+itemId,JSON.stringify(persistable));
    // Keep full list in memory
    if(!window._sessionAttachments)window._sessionAttachments={};
    window._sessionAttachments[MKT_PLAN_MONTH+'_'+itemId]=arr;
  }else{
    const evts=getCustomEvents();
    const evt=evts.find(ev=>ev.id===itemId);
    if(!evt)return;
    if(!evt.attachments)evt.attachments=[];
    evt.attachments.push(entry);
    // Only persist non-blob entries
    const toSave=evts.map(e=>({...e,attachments:(e.attachments||[]).filter(a=>!a.blob)}));
    saveCustomEvents(toSave);
    // Keep session reference
    if(!window._sessionAttachments)window._sessionAttachments={};
    window._sessionAttachments[itemId]=evt.attachments;
  }
}

function addAttachmentFromInput(itemId){
  const input=document.getElementById('url-'+itemId);
  const url=input.value.trim();
  if(!url)return;
  const isImg=/\.(jpg|jpeg|png|gif|webp)$/i.test(url);
  const isVid=/\.(mp4|mov|avi|webm|mkv)$/i.test(url);
  const entry={name:url.split('/').pop()||'链接',url:url,type:isImg?'image':isVid?'video':'link'};
  if(itemId.startsWith('plan_')){
    const arr=getAllAttachments(itemId);
    arr.push(entry);
    savePlanAttachments(itemId,arr);
  }else{
    const evts=getCustomEvents();
    const evt=evts.find(e=>e.id===itemId);
    if(!evt)return;
    if(!evt.attachments)evt.attachments=[];
    evt.attachments.push(entry);
    saveCustomEvents(evts);
  }
  renderMarketing();
}

          const isImg=/\.(jpg|jpeg|png|gif|webp)$/i.test(a.url)||a.type==='image';
          const isVideo=/\.(mp4|mov|avi|webm|mkv)$/i.test(a.url)||a.type==='video';
          let preview='';
          if(isImg&&a.url.startsWith('data:')) preview='<img src="'+a.url+'" class="attach-thumb" onclick="previewKllAttach(\''+item.id+'\','+i+')">';

      const published=item.published||false;

function getKllAttachments(itemId){
  if(window._sessionAttachments&&window._sessionAttachments['kll_'+itemId])return window._sessionAttachments['kll_'+itemId];
  const evts=getKllEvents();
  const evt=evts.find(e=>e.id===itemId);
  return (evt&&evt.attachments)||[];
}

function handleKllFileUpload(itemId,input){
  const files=input.files;
  if(!files.length)return;
  Array.from(files).forEach(file=>{
    const isImg=file.type.startsWith('image/');
    const isVid=file.type.startsWith('video/');
    if(isVid||file.size>2*1024*1024){
      const objUrl=URL.createObjectURL(file);
      const entry={name:file.name,url:objUrl,type:isVid?'video':'file',size:file.size,blob:true};
      addKllAttachEntry(itemId,entry);
      renderMarketing();
    }else{
      const reader=new FileReader();
      reader.onload=function(e){
        const entry={name:file.name,url:e.target.result,type:isImg?'image':'file',size:file.size};
        addKllAttachEntry(itemId,entry);
        renderMarketing();
      };
      reader.readAsDataURL(file);
    }
  });
  input.value='';
}

function addKllAttachEntry(itemId,entry){
  const evts=getKllEvents();
  const evt=evts.find(e=>e.id===itemId);
  if(!evt)return;
  if(!evt.attachments)evt.attachments=[];
  evt.attachments.push(entry);
  const toSave=evts.map(e=>({...e,attachments:(e.attachments||[]).filter(a=>!a.blob)}));
  saveKllEvents(toSave);
  if(!window._sessionAttachments)window._sessionAttachments={};
  window._sessionAttachments['kll_'+itemId]=evt.attachments;
}

function addKllAttachmentFromInput(itemId){

  const isImg=/\.(jpg|jpeg|png|gif|webp)$/i.test(url);
  const isVid=/\.(mp4|mov|avi|webm|mkv)$/i.test(url);
  const entry={name:url.split('/').pop()||'链接',url:url,type:isImg?'image':isVid?'video':'link'};
  const evts=getKllEvents();
  const evt=evts.find(e=>e.id===itemId);
  if(!evt)return;
  if(!evt.attachments)evt.attachments=[];
  evt.attachments.push(entry);
  saveKllEvents(evts);
  renderMarketing();
}

function renderGantt(brandItems, kllItems, monthStr){
  const combined=[...brandItems.map(i=>({...i,source:'brand'})),...kllItems.map(i=>({...i,source:'kll'}))];
  if(!combined.length)return'';
  const year=MDATA.year||2026;
  const month=parseInt(monthStr);
  const daysInMonth=new Date(year,month,0).getDate();
  let headerCells='';
  for(let d=1;d<=daysInMonth;d++){
    const isWeekend=new Date(year,month-1,d).getDay()%6===0;
    headerCells+='<div class="gantt-cell gantt-header '+(isWeekend?'weekend':'')+'">'+d+'</div>';
  }
  let rows='';
  combined.forEach(item=>{
    if(!item.date)return;
    const startDay=parseInt(item.date.split('-')[2])||1;
    const clampStart=Math.max(1,Math.min(startDay,daysInMonth));
    const colorClass=item.source==='kll'?'gantt-active-kll':'gantt-active';
    let cells='';
    for(let d=1;d<=daysInMonth;d++){
      cells+='<div class="gantt-cell '+(d===clampStart?colorClass:'')+'"></div>';
    }
    const label=(item.subject||'').substring(0,12);
    rows+='<div class="gantt-row"><div class="gantt-label" title="'+(item.subject||'')+'" style="'+(item.source==='kll'?'color:#ea580c':'')+'">'+label+'</div><div class="gantt-cells">'+cells+'</div></div>';
  });
  return '<div class="gantt-chart"><div class="gantt-row gantt-header-row"><div class="gantt-label" style="font-weight:700">事项</div><div class="gantt-cells">'+headerCells+'</div></div>'+rows+'</div>';
}

function renderAdROI(){
  const ad=MDATA.ad_data||{};
  const monthly=ad.monthly||[];
  if(!monthly.length)return'<div class="mkt-section"><h2>💰 广告投放数据</h2><p style="color:#94a3b8">暂无数据</p></div>';
  const EXCLUDED_CHANNELS=['AI','合计','OK哥'];
  function filterChannels(obj){
    if(!obj)return{};
    const r={};Object.keys(obj).forEach(k=>{if(!EXCLUDED_CHANNELS.includes(k))r[k]=obj[k]});return r;
  }
  function fmtMoney(v){return v>10000?'¥'+(v/10000).toFixed(2)+'万':'¥'+(v||0).toLocaleString()}
  let tabs=monthly.map(m=>'<button class="mkt-month-btn '+(m.month===MKT_AD_MONTH?'active':'')+'" onclick="switchAdMonth(\''+m.month+'\')">'+m.month.replace('26.','')+'月</button>').join('');
  tabs+='<button class="mkt-month-btn '+(MKT_AD_MONTH==='yearly'?'active':'')+'" onclick="switchAdMonth(\'yearly\')">全年</button>';
  let kpiHtml='',channelTableHtml='';
  if(MKT_AD_MONTH==='yearly'){
    let yLeads=0,ySpend=0,yRecharge=0,yPerfNew=0,yPerfOld=0;
    const chAgg={};
    monthly.forEach(m=>{
      const ch=filterChannels(m.channel_leads||{});
      const cs=filterChannels(m.channels||{});
      yLeads+=Object.values(ch).reduce((a,b)=>a+b,0);
      ySpend+=Object.values(cs).reduce((a,b)=>a+b,0);
      yRecharge+=(m.kpi&&m.kpi.recharge)||0;
      yPerfNew+=(m.kpi&&m.kpi.performance_new)||0;
      yPerfOld+=(m.kpi&&m.kpi.performance_old)||0;
      Object.keys(ch).forEach(k=>{if(!chAgg[k])chAgg[k]={leads:0,spend:0};chAgg[k].leads+=ch[k]});
      Object.keys(cs).forEach(k=>{if(!chAgg[k])chAgg[k]={leads:0,spend:0};chAgg[k].spend+=cs[k]});
    });
    const yAvg=yLeads>0?(ySpend/yLeads):0;
    const yTotal=yPerfNew+yPerfOld;
    kpiHtml='<div class="mkt-kpi-row" style="grid-template-columns:repeat(4,1fr)">'+
      '<div class="mkt-kpi"><div class="mk-label">全年充值</div><div class="mk-value" style="color:#8b5cf6">'+fmtMoney(yRecharge)+'</div></div>'+
      '<div class="mkt-kpi"><div class="mk-label">全年留资数</div><div class="mk-value" style="color:#2563eb">'+yLeads+'</div></div>'+
      '<div class="mkt-kpi"><div class="mk-label">平均成本</div><div class="mk-value">¥'+yAvg.toFixed(1)+'</div></div>'+
      '<div class="mkt-kpi"><div class="mk-label">全年总消费</div><div class="mk-value" style="color:#ea580c">'+fmtMoney(ySpend)+'</div></div>'+
      '</div><div class="mkt-kpi-row" style="grid-template-columns:1fr">'+
      '<div class="mkt-kpi"><div class="mk-label">转化业绩</div><div class="mk-value" style="color:#7c3aed">'+(yTotal?fmtMoney(yTotal):'¥-')+'</div><div style="font-size:11px;color:#64748b;margin-top:2px">新客 <span style="color:#10b981;font-weight:600">'+(yPerfNew?fmtMoney(yPerfNew):'¥0')+'</span> | 老客 <span style="color:#0891b2;font-weight:600">'+(yPerfOld?fmtMoney(yPerfOld):'¥0')+'</span></div></div>'+
      '</div>';
    const chKeys=Object.keys(chAgg).sort((a,b)=>chAgg[b].leads-chAgg[a].leads);
    channelTableHtml='<div style="margin:16px 0;overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr style="background:#f1f5f9"><th style="padding:8px 12px;text-align:left;border-bottom:2px solid #e2e8f0">渠道</th><th style="padding:8px 12px;text-align:right;border-bottom:2px solid #e2e8f0">留资数</th><th style="padding:8px 12px;text-align:right;border-bottom:2px solid #e2e8f0">消费</th><th style="padding:8px 12px;text-align:right;border-bottom:2px solid #e2e8f0">留资成本</th><th style="padding:8px 12px;text-align:right;border-bottom:2px solid #e2e8f0">占比</th></tr></thead><tbody>'+
      chKeys.map(k=>{
        const c=chAgg[k];const cost=c.leads>0?(c.spend/c.leads):0;const pct=yLeads>0?Math.round(c.leads/yLeads*100):0;
        return '<tr><td style="padding:6px 12px;border-bottom:1px solid #f1f5f9">'+k+'</td><td style="padding:6px 12px;text-align:right;border-bottom:1px solid #f1f5f9;font-weight:600;color:#2563eb">'+c.leads+'</td><td style="padding:6px 12px;text-align:right;border-bottom:1px solid #f1f5f9">'+fmtMoney(c.spend)+'</td><td style="padding:6px 12px;text-align:right;border-bottom:1px solid #f1f5f9">¥'+cost.toFixed(1)+'</td><td style="padding:6px 12px;text-align:right;border-bottom:1px solid #f1f5f9">'+pct+'%</td></tr>';
      }).join('')+
      '<tr style="background:#f8fafc;font-weight:600"><td style="padding:6px 12px">合计</td><td style="padding:6px 12px;text-align:right;color:#2563eb">'+yLeads+'</td><td style="padding:6px 12px;text-align:right">'+fmtMoney(ySpend)+'</td><td style="padding:6px 12px;text-align:right">¥'+yAvg.toFixed(1)+'</td><td style="padding:6px 12px;text-align:right">100%</td></tr>'+
      '</tbody></table></div>';
  }else{
    const cur=monthly.find(m=>m.month===MKT_AD_MONTH)||monthly[monthly.length-1];
    const kpi=cur.kpi||{};
    const ch=filterChannels(cur.channel_leads||{});
    const cs=filterChannels(cur.channels||{});
    const filteredLeads=Object.values(ch).reduce((a,b)=>a+b,0);
    const filteredSpend=Object.values(cs).reduce((a,b)=>a+b,0);
    const filteredAvg=filteredLeads>0?(filteredSpend/filteredLeads):0;
    const recharge=kpi.recharge||0;
    const perfNew=kpi.performance_new||0;
    const perfOld=kpi.performance_old||0;
    const perfTotal=perfNew+perfOld;
    const curIdx=monthly.indexOf(cur);
    let momLeadsHtml='',momPerfHtml='';
    if(curIdx>0){
      const prev=monthly[curIdx-1];
      const prevCh=filterChannels(prev.channel_leads||{});
      const prevLeads=Object.values(prevCh).reduce((a,b)=>a+b,0);
      if(prevLeads>0){
        const momChange=Math.round((filteredLeads-prevLeads)/prevLeads*100);
        const momColor=momChange>=0?'#10b981':'#ef4444';
        momLeadsHtml='<div class="mkt-kpi"><div class="mk-label">留资环比</div><div class="mk-value" style="color:'+momColor+'">'+(momChange>=0?'+':'')+momChange+'%</div></div>';
      }
      const prevKpi=prev.kpi||{};
      const prevTotal=(prevKpi.performance_new||0)+(prevKpi.performance_old||0);
      if(prevTotal>0&&perfTotal>0){
        const perfMom=Math.round((perfTotal-prevTotal)/prevTotal*100);
        const perfColor=perfMom>=0?'#10b981':'#ef4444';
        momPerfHtml='<div class="mkt-kpi"><div class="mk-label">业绩环比</div><div class="mk-value" style="color:'+perfColor+'">'+(perfMom>=0?'+':'')+perfMom+'%</div></div>';
      }
    }
    kpiHtml='<div class="mkt-kpi-row" style="grid-template-columns:repeat(4,1fr)">'+
      '<div class="mkt-kpi"><div class="mk-label">充值金额</div><div class="mk-value" style="color:#8b5cf6">'+(recharge?fmtMoney(recharge):'¥0')+'</div></div>'+
      '<div class="mkt-kpi"><div class="mk-label">本月留资数</div><div class="mk-value" style="color:#2563eb">'+filteredLeads+'</div></div>'+
      '<div class="mkt-kpi"><div class="mk-label">平均留资成本</div><div class="mk-value">¥'+filteredAvg.toFixed(1)+'</div></div>'+
      '<div class="mkt-kpi"><div class="mk-label">总消费</div><div class="mk-value" style="color:#ea580c">'+fmtMoney(filteredSpend)+'</div></div>'+
      '</div><div class="mkt-kpi-row" style="grid-template-columns:repeat(3,1fr)">'+
      '<div class="mkt-kpi"><div class="mk-label">转化业绩</div><div class="mk-value" style="color:#7c3aed">'+(perfTotal?fmtMoney(perfTotal):'¥-')+'</div><div style="font-size:11px;color:#64748b;margin-top:2px">新客 <span style="color:#10b981;font-weight:600">'+(perfNew?fmtMoney(perfNew):'¥0')+'</span> | 老客 <span style="color:#0891b2;font-weight:600">'+(perfOld?fmtMoney(perfOld):'¥0')+'</span></div></div>'+
      momLeadsHtml+momPerfHtml+'</div>';
    // Channel detail table
    const allChKeys=new Set([...Object.keys(ch),...Object.keys(cs)]);
    const chArr=Array.from(allChKeys).sort((a,b)=>(ch[b]||0)-(ch[a]||0));
    if(chArr.length){
      channelTableHtml='<div style="margin:16px 0;overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr style="background:#f1f5f9"><th style="padding:8px 12px;text-align:left;border-bottom:2px solid #e2e8f0">渠道</th><th style="padding:8px 12px;text-align:right;border-bottom:2px solid #e2e8f0">留资数</th><th style="padding:8px 12px;text-align:right;border-bottom:2px solid #e2e8f0">消费</th><th style="padding:8px 12px;text-align:right;border-bottom:2px solid #e2e8f0">留资成本</th><th style="padding:8px 12px;text-align:right;border-bottom:2px solid #e2e8f0">占比</th></tr></thead><tbody>'+
        chArr.map(k=>{
          const leads=ch[k]||0;const spend=cs[k]||0;const cost=leads>0?(spend/leads):0;const pct=filteredLeads>0?Math.round(leads/filteredLeads*100):0;
          return '<tr><td style="padding:6px 12px;border-bottom:1px solid #f1f5f9">'+k+'</td><td style="padding:6px 12px;text-align:right;border-bottom:1px solid #f1f5f9;font-weight:600;color:#2563eb">'+leads+'</td><td style="padding:6px 12px;text-align:right;border-bottom:1px solid #f1f5f9">'+fmtMoney(spend)+'</td><td style="padding:6px 12px;text-align:right;border-bottom:1px solid #f1f5f9">'+(cost>0?'¥'+cost.toFixed(1):'-')+'</td><td style="padding:6px 12px;text-align:right;border-bottom:1px solid #f1f5f9">'+pct+'%</td></tr>';
        }).join('')+
        '<tr style="background:#f8fafc;font-weight:600"><td style="padding:6px 12px">合计</td><td style="padding:6px 12px;text-align:right;color:#2563eb">'+filteredLeads+'</td><td style="padding:6px 12px;text-align:right">'+fmtMoney(filteredSpend)+'</td><td style="padding:6px 12px;text-align:right">¥'+filteredAvg.toFixed(1)+'</td><td style="padding:6px 12px;text-align:right">100%</td></tr>'+
        '</tbody></table></div>';
    }
  }
  return '<div class="mkt-section"><h2>💰 广告投放数据</h2>'+
    '<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">'+tabs+'</div>'+
    kpiHtml+
    '<div class="mkt-chart-row"><div class="mkt-chart-box"><div id="chart-ad-daily" style="height:260px"></div></div><div class="mkt-chart-box"><div id="chart-ad-pie" style="height:260px"></div></div></div>'+
    channelTableHtml+'</div>';
}

// === Overseas Accounts Section ===
var MKT_ACCT_PLATFORM='all';
var MKT_ACCT_MONTH=0;
function renderAccounts(){
  const os=MDATA.overseas||{};
  const acct=os.accounts||{};
  const monthly=acct.monthly||[];
  if(!monthly.length)return'';
  if(!MKT_ACCT_MONTH||!monthly.find(m=>m.month===MKT_ACCT_MONTH))MKT_ACCT_MONTH=monthly[monthly.length-1].month;
  
  // Month tabs
  let monthTabs=monthly.map(m=>'<button class="mkt-month-btn '+(MKT_ACCT_MONTH===m.month?'active':'')+'" onclick="switchAcctMonth('+m.month+')">'+m.month+'月</button>').join('');
  
  // Get current month data
  const curMonth=monthly.find(m=>m.month===MKT_ACCT_MONTH)||monthly[monthly.length-1];
  const weeklyData=curMonth.weekly||{};
  
  // Platform tabs
  const availPlatforms=Object.keys(weeklyData);
  const allPlatforms=['all',...availPlatforms];
  let platTabs=allPlatforms.map(p=>'<button class="mkt-month-btn '+(MKT_ACCT_PLATFORM===p?'active':'')+'" style="font-size:11px;padding:3px 8px" onclick="switchAcctPlatform(\''+p.replace(/'/g,"\\'")+'\')">'+
    (p==='all'?'全部':p.replace('TikTok (主号)','TikTok主').replace('TikTok (OK哥)','TikTok-OK').replace('TikTok (早期)','TikTok早'))+'</button>').join('');
  
  let bodyHtml='';
  if(MKT_ACCT_PLATFORM==='all'){
    // Summary cards for all platforms — show TOTALS for the month
    const summaryPlatforms=availPlatforms.filter(p=>p!=='TikTok (早期)');
    let cards='';
    summaryPlatforms.forEach(p=>{
      const w=weeklyData[p]||[];
      if(!w.length)return;
      // Sum all weeks in this month
      let totalViews=0,totalFollowers=0,totalInteract=0;
      let isImpressions=false;
      w.forEach(r=>{
        if(r.impressions!==undefined)isImpressions=true;
        totalViews+=(r.views||r.impressions||0);
        totalFollowers+=(r.followers||r.subscribers||0);
        totalInteract+=(r.interactions||r.likes||0);
      });
      const mainLabel=isImpressions?'展示':'浏览/播放';
      cards+='<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;min-width:140px">'+
        '<div style="font-size:12px;font-weight:700;color:var(--text);margin-bottom:6px">'+p.replace('TikTok (主号)','TikTok 主号').replace('TikTok (OK哥)','TikTok OK哥')+'</div>'+
        '<div style="font-size:18px;font-weight:800;color:#2563eb">'+totalViews.toLocaleString()+'</div>'+
        '<div style="font-size:11px;color:#64748b">'+mainLabel+'（'+w.length+'周合计）</div>'+
        '<div style="font-size:11px;color:#64748b;margin-top:4px">粉丝+'+totalFollowers+' | 互动'+totalInteract+'</div>'+
        '</div>';
    });
    bodyHtml='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px">'+cards+'</div>';
    bodyHtml+='<div class="mkt-chart-row" style="margin-top:16px"><div class="mkt-chart-box"><div id="chart-acct-compare" style="height:280px"></div></div></div>';
  }else{
    // Single platform detail — sort by date properly
    const w=weeklyData[MKT_ACCT_PLATFORM]||[];
    if(w.length){
      const sortByPeriod=(a,b)=>{
        const pa=a.period.split('/');const pb=b.period.split('/');
        const ma=parseInt(pa[0]),da=parseInt(pa[1]);
        const mb=parseInt(pb[0]),db=parseInt(pb[1]);
        return ma!==mb?ma-mb:da-db;
      };
      let rows=[...w].sort(sortByPeriod).map(r=>{
        const views=r.views||r.impressions||0;
        const fans=r.followers||r.subscribers||0;
        const interact=r.interactions||r.likes||0;
        return '<tr><td>'+r.period+'</td><td style="text-align:right">'+views.toLocaleString()+'</td><td style="text-align:right">'+fans+'</td><td style="text-align:right">'+interact+'</td><td style="text-align:right">'+(r.reach||r.visits||r.profile_visits||'-')+'</td></tr>';
      }).join('');
      bodyHtml='<table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:12px"><thead><tr style="background:#f1f5f9"><th style="padding:6px 8px;text-align:left">周期</th><th style="padding:6px 8px;text-align:right">浏览/播放</th><th style="padding:6px 8px;text-align:right">新增粉丝</th><th style="padding:6px 8px;text-align:right">互动/赞</th><th style="padding:6px 8px;text-align:right">触达/访问</th></tr></thead><tbody>'+rows+'</tbody></table>';
    }
    bodyHtml+='<div class="mkt-chart-row" style="margin-top:12px"><div class="mkt-chart-box"><div id="chart-acct-trend" style="height:220px"></div></div></div>';
  }
  return '<div class="mkt-section"><h2>📱 海外账号数据</h2>'+
    '<div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">'+monthTabs+'</div>'+
    '<div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">'+platTabs+'</div>'+bodyHtml+'</div>';
}

// === Team Funnel Section (with team breakdown) ===
function renderFunnel(){
  const tf=MDATA.team_funnel||{};
  const monthly=tf.monthly||[];
  const yearly=tf.yearly_total||{};
  if(!monthly.length)return'<div class="mkt-section"><h2>📊 团队获客漏斗</h2><p style="color:#94a3b8">暂无数据</p></div>';
  let tabs=monthly.map(m=>'<button class="mkt-month-btn '+(m.month===MKT_FUNNEL_MONTH?'active':'')+'" onclick="switchFunnelMonth('+m.month+')">'+m.month+'月</button>').join('');
  tabs+='<button class="mkt-month-btn '+(MKT_FUNNEL_MONTH==='yearly'?'active':'')+'" onclick="switchFunnelMonth(\'yearly\')">全年</button>';
  let bodyHtml='';
  if(MKT_FUNNEL_MONTH==='yearly'){
    bodyHtml=renderFunnelVisual(yearly.assigned||0,yearly.added||0,yearly.crm||0,yearly.conversion_amount||0)+
      '<div style="margin-top:12px;font-size:12px;color:#64748b;text-align:center">全年添加率: '+(yearly.assigned?Math.round(yearly.added/yearly.assigned*100):0)+'% | 建CRM率: '+(yearly.assigned?Math.round(yearly.crm/yearly.assigned*100):0)+'%</div>';
  }else{
    const cur=monthly.find(m=>m.month===MKT_FUNNEL_MONTH)||monthly[monthly.length-1];
    const members=(cur.members||[]).filter(m=>m.assigned>0);
    const funnel=cur.funnel||{};
    bodyHtml=renderFunnelVisual(funnel.assigned||0,funnel.added||0,funnel.crm||0,0);
    // Team breakdown
    const blueMembers=members.filter(m=>m.team==='蓝队');
    const orangeMembers=members.filter(m=>m.team==='橙队');
    const blueStats=calcTeamStats(blueMembers);
    const orangeStats=calcTeamStats(orangeMembers);
    bodyHtml+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px">'+
      renderTeamCard('蓝队',blueStats,blueMembers,'#2563eb')+
      renderTeamCard('橙队',orangeStats,orangeMembers,'#ea580c')+
      '</div>';
  }
  return '<div class="mkt-section"><h2>📊 团队获客漏斗</h2>'+
    '<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">'+tabs+'</div>'+
    bodyHtml+'</div>';
}
function switchFunnelMonth(m){MKT_FUNNEL_MONTH=m;renderAcquisition()}

function calcTeamStats(members){
  const assigned=members.reduce((s,m)=>s+m.assigned,0);
  const added=members.reduce((s,m)=>s+(m.added||0),0);
  const crm=members.reduce((s,m)=>s+(m.crm_count||0),0);
  const conv=members.reduce((s,m)=>s+(m.conversion_amount||0),0);
  return {assigned,added,crm,conversion_amount:conv,
    add_rate:assigned?Math.round(added/assigned*100):0,
    crm_rate:assigned?Math.round(crm/assigned*100):0};
}

function renderFunnelVisual(assigned,added,crm,conv){
  let convHtml='';
  if(conv>0) convHtml='<div style="font-size:20px;color:#94a3b8">→</div><div style="background:#fce7f3;padding:12px 24px;border-radius:8px;text-align:center"><div style="font-size:24px;font-weight:800;color:#db2777">¥'+(conv/10000).toFixed(1)+'万</div><div style="font-size:11px;color:#64748b">转化金额</div></div>';
  return '<div class="mkt-funnel-visual"><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center">'+
    '<div style="background:#dbeafe;padding:12px 24px;border-radius:8px;text-align:center"><div style="font-size:24px;font-weight:800;color:#2563eb">'+assigned+'</div><div style="font-size:11px;color:#64748b">分配</div></div>'+
    '<div style="font-size:20px;color:#94a3b8">→</div>'+
    '<div style="background:#d1fae5;padding:12px 24px;border-radius:8px;text-align:center"><div style="font-size:24px;font-weight:800;color:#10b981">'+added+'</div><div style="font-size:11px;color:#64748b">添加微信</div></div>'+
    '<div style="font-size:20px;color:#94a3b8">→</div>'+
    '<div style="background:#fef3c7;padding:12px 24px;border-radius:8px;text-align:center"><div style="font-size:24px;font-weight:800;color:#ca8a04">'+crm+'</div><div style="font-size:11px;color:#64748b">建CRM</div></div>'+
    convHtml+'</div></div>';
}

function renderTeamCard(teamName,stats,members,color){
  let rows=members.map(m=>{
    const name=m.name.replace('@','');
    const addCls=m.add_rate<85?'warn':'';
    const crmCls=m.crm_rate<40?'warn':'';
    return '<tr><td>'+name+'</td><td>'+m.assigned+'</td><td class="'+addCls+'">'+m.add_rate.toFixed(0)+'%</td><td class="'+crmCls+'">'+m.crm_rate.toFixed(0)+'%</td><td>'+(m.conversion_amount?'¥'+Math.round(m.conversion_amount).toLocaleString():'-')+'</td></tr>';
  }).join('');
  return '<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px">'+
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span style="background:'+color+';color:#fff;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:700">'+teamName+'</span>'+
    '<span style="font-size:12px;color:#64748b">分配'+stats.assigned+' | 添加率'+stats.add_rate+'% | CRM率'+stats.crm_rate+'%</span></div>'+
    '<table class="mkt-funnel-table" style="font-size:12px"><thead><tr><th>姓名</th><th>分配</th><th>添加率</th><th>CRM率</th><th>转化</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

// === ECharts Initialization ===
function initAllCharts(){
  const ad=MDATA.ad_data||{};
  const monthly=ad.monthly||[];
  const EXCLUDED_CH=['AI','合计','OK哥'];
  function filterObj(o){const r={};Object.keys(o||{}).forEach(k=>{if(!EXCLUDED_CH.includes(k))r[k]=o[k]});return r}
  let chartData=null;
  if(MKT_AD_MONTH==='yearly'){

let S1688_DATA=null,S1688_PERIOD='week',S1688_STORE='Inflation',S1688_START='',S1688_END='',S1688_DETAIL_START='',S1688_DETAIL_END='';
const S1688_STORES=['Inflation','Techlation','Teeshe'];

function loadStore1688Data(){
  if(S1688_DATA){renderStore1688();return;}
  fetch('store1688_data.json?v='+Date.now()).then(r=>r.json()).then(d=>{S1688_DATA=d;renderStore1688();}).catch(e=>{
    document.getElementById('store1688-content').innerHTML='<div style="text-align:center;padding:40px;color:#ef4444">数据加载失败</div>';
  });
}
function s1688Recent(s){
  const d=S1688_DATA.stores[s]?.daily||[];
  if(S1688_PERIOD==='yesterday'){var yd=new Date();yd.setDate(yd.getDate()-1);var yds=yd.toISOString().slice(0,10);return d.filter(function(r){return r.date===yds;});}
  if(S1688_PERIOD==='custom'&&S1688_START&&S1688_END){return d.filter(function(r){return r.date>=S1688_START&&r.date<=S1688_END;});}
  const n=S1688_PERIOD==='week'?7:S1688_PERIOD==='month'?30:9999;return d.slice(-n);
}
function s1688Prev(s){
  var d=S1688_DATA.stores[s]?.daily||[];
  if(S1688_PERIOD==="yesterday"){var yd=new Date();yd.setDate(yd.getDate()-2);var yds=yd.toISOString().slice(0,10);return d.filter(function(r){return r.date===yds;});}
  if(S1688_PERIOD==="custom"&&S1688_START&&S1688_END){
    var s1=new Date(S1688_START),e1=new Date(S1688_END);
    var span=Math.round((e1-s1)/(86400000))+1;
    var ps=new Date(s1);ps.setDate(ps.getDate()-span);
    var pe=new Date(s1);pe.setDate(pe.getDate()-1);
    var pss=ps.toISOString().slice(0,10),pes=pe.toISOString().slice(0,10);
    return d.filter(function(r){return r.date>=pss&&r.date<=pes;});
  }
  var n=S1688_PERIOD==="week"?7:S1688_PERIOD==="month"?30:9999;
  if(n>=9999)return [];
  return d.slice(-(n*2),-n);
}function s1688RecentDetail(s){
  const d=S1688_DATA.stores[s]?.daily||[];
  if(S1688_DETAIL_START&&S1688_DETAIL_END){return d.filter(function(r){return r.date>=S1688_DETAIL_START&&r.date<=S1688_DETAIL_END;});}
  // default: current month
  var now=new Date();var ms=new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10);
  return d.filter(function(r){return r.date>=ms;});
}
function s1688Sum(a,k){return a.reduce((s,r)=>s+(r[k]||0),0);}
function s1688Avg(a,k){const v=a.filter(r=>r[k]>0);return v.length?s1688Sum(v,k)/v.length:0;}
function s1688Fm(n){if(n>=10000)return'¥'+(n/10000).toFixed(1)+'万';return'¥'+Math.round(n).toLocaleString();}
function s1688Fn(n){if(n>=10000)return(n/10000).toFixed(1)+'万';if(n>=1000)return(n/1000).toFixed(1)+'k';return Math.round(n).toLocaleString();}
function s1688Fp(n){if(n==null||isNaN(n))return'--';return n<1?(n*100).toFixed(1)+'%':n.toFixed(1)+'%';}
function s1688SetPeriod(p){S1688_PERIOD=p;if(p!=='custom'){S1688_START='';S1688_END='';}renderStore1688();}
function s1688ApplyRange(){var s=document.getElementById('s1688-range-start').value;var e=document.getElementById('s1688-range-end').value;if(s&&e){S1688_PERIOD='custom';S1688_START=s;S1688_END=e;renderStore1688();}}

const _K='jiezhan2026';
const _E=[13,0,17,18,29,3,49,66,81,70,105,91,88,38,60,45,51,42,97,121,2,91,15,63,14,20,41,6,30,72,99,81,91,53,43,60,79,30,43,37,93,95,98,103,93,15,17,66,89,3,36,72,70,106,95,25,88,87,45,2,4,34,81,126,67,115,45,56,38,73,41,38,6,101,88,116,103,41,32,82,34,92,84,92,102,126,88,125,43,26,20,48,4];
function _D(){return _E.map((c,i)=>String.fromCharCode(c^_K.charCodeAt(i%_K.length))).join('')}
const SYNC_REPO='x5268002-tech/talent-dashboards';
const SYNC_FILE='todos_data.json';
let SYNC_SHA=null;
let SYNC_DEBOUNCE=null;

function loadTodosFromCloud(){
  fetch('https://api.github.com/repos/'+SYNC_REPO+'/contents/'+SYNC_FILE,{
    headers:{'Authorization':'Bearer '+_D(),'User-Agent':'dashboard'}
  }).then(r=>r.json()).then(d=>{
    if(d.sha)SYNC_SHA=d.sha;
    if(d.content){
      const json=JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\n/g,'')))));
      if(json.vip&&json.vip.length){localStorage.setItem('vip_todos',JSON.stringify(json.vip));if(typeof renderTodos==='function')renderTodos();}
      if(json.kelala&&json.kelala.length){localStorage.setItem('kelala_todos',JSON.stringify(json.kelala));if(typeof renderKelalaTodos==='function')renderKelalaTodos();}
      if(json.store1688&&json.store1688.length){localStorage.setItem('store1688_todos',JSON.stringify(json.store1688));if(typeof renderS1688Todos==='function')renderS1688Todos();}
      // Restore marketing localStorage data
      if(json.marketing){
        Object.keys(json.marketing).forEach(function(k){
          localStorage.setItem(k,JSON.stringify(json.marketing[k]));
        });
        if(typeof renderMarketing==='function')renderMarketing();
      }
    }
  }).catch(()=>{});
}

function saveTodosToCloud(){
  if(SYNC_DEBOUNCE)clearTimeout(SYNC_DEBOUNCE);
  SYNC_DEBOUNCE=setTimeout(function(){
    // Collect all marketing localStorage keys
    var mkt={};
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k.startsWith('planEdit_')||k.startsWith('mat_')||k.startsWith('attach_')||k==='marketing_custom_events'||k==='marketing_month_themes'){
        try{mkt[k]=JSON.parse(localStorage.getItem(k))}catch(e){mkt[k]=localStorage.getItem(k)}
      }
    }
    const data={
      vip:JSON.parse(localStorage.getItem('vip_todos')||'[]'),
      kelala:JSON.parse(localStorage.getItem('kelala_todos')||'[]'),
      store1688:JSON.parse(localStorage.getItem('store1688_todos')||'[]'),
      marketing:mkt,
      updated_at:new Date().toISOString()
    };
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
    const body={message:'sync: auto-update todos',content:content};
    if(SYNC_SHA)body.sha=SYNC_SHA;
    fetch('https://api.github.com/repos/'+SYNC_REPO+'/contents/'+SYNC_FILE,{
      method:'PUT',
      headers:{'Authorization':'Bearer '+_D(),'Content-Type':'application/json','User-Agent':'dashboard'},
      body:JSON.stringify(body)
    }).then(r=>r.json()).then(d=>{if(d.content&&d.content.sha)SYNC_SHA=d.content.sha}).catch(()=>{});
  },3000);
}

localStorage.setItem=function(key,value){
  _origSetItem(key,value);
  if(key.startsWith('planEdit_')||key.startsWith('mat_')||key.startsWith('attach_')||key==='marketing_custom_events'||key==='marketing_month_themes'){
    saveTodosToCloud();
  }
};

loadTodosFromCloud();

// Role-based tab filtering
(function(){
  var params=new URLSearchParams(window.location.search);
  var role=params.get("role");
  if(!role||role==="admin")return;
  var ROLE_TABS={"sales":["sales","vip"],"kelala":["marketing","acquisition"],"1688":["sales","store1688"]};
  var allowed=ROLE_TABS[role];
  if(!allowed)return;
  var panelNames=["sales","vip","marketing","acquisition","store1688"];
  var tabs=document.querySelectorAll(".top-tab");
  tabs.forEach(function(t,i){if(!allowed.includes(panelNames[i])){t.style.display="none"}});
  var first=allowed[0];
  tabs.forEach(function(t,i){t.classList.remove("active");if(panelNames[i]===first)t.classList.add("active")});
  document.querySelectorAll(".panel").forEach(function(p){p.style.display="none"});
  document.getElementById("panel-"+first).style.display="";
  if(first==="vip")renderTodos();
  if(first==="marketing")loadMarketingData();
  if(first==="acquisition"){loadAcquisitionData();renderKelalaTodos();}
  if(first==="store1688"){loadStore1688Data();renderS1688Todos();}
  var titles={"sales":"供应链销售看板","kelala":"客拉拉看板","1688":"1688运营看板"};
  var icons={"sales":"💼","kelala":"🎯","1688":"🏪"};
  if(titles[role]){document.querySelector(".header h1").innerHTML=titles[role]+" <span>"+icons[role]+"</span>"}
})();
</script>
